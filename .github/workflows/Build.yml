name: Engine build and core regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure
        run: cmake -S . -B Build/CI -DCMAKE_BUILD_TYPE=Debug -DBELLWETHER_BUILD_GRAPHICS=OFF
      - name: Build
        run: cmake --build Build/CI --config Debug --parallel 4
      - name: Test
        run: ctest --test-dir Build/CI -C Debug --output-on-failure
